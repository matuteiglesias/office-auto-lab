schema_version: 1
id: ops.office.runtime
repository:
  id: repo.office-auto-lab
  github: matuteiglesias/office-auto-lab
domain: operations
system: ops.office
role: automation-runtime
lifecycle: active

lifecycle_classes:
  core:
    class: core
    paths:
      - src/office_runtime/office
      - src/office_runtime/staff
      - src/office_runtime/run_logging.py
      - src/office_runtime/ledger.py
      - src/office_runtime/scripts/run_generation_v2.py
      - src/office_runtime/scripts/compile_runtime_health_v2.py
      - systemd/user
    rule: supported Office v2 runtime and orchestration boundary
  sidecar:
    class: sidecar
    paths:
      - src/office_runtime/capture
      - src/office_runtime/evidence
      - src/office_runtime/editorial
      - src/office_runtime/estate_movement.py
    rule: adjacent producer or consumer with an explicit interface; cannot redefine Office governance semantics

canonical_reference: docs/architecture/coherent-generation-v2.md

authority:
  status: active
  owns:
    - read-only Control Tower v2 intake and validation
    - governed front-to-repository-to-workspace resolution for Office execution context
    - deterministic typed work compilation from structured Control Tower state
    - bounded Staff triage and evidence preparation over a frozen snapshot
    - bounded Principal attention compilation from prepared Staff packets
    - bounded execution-envelope compilation from Principal ready pulls and operator contracts
    - packet-linked execution receipt validation and non-mutating closure/reentry proposals
    - coherent run-scoped Office generations and last-known-good publication
    - canonical Office run records and derived runtime-health projection
    - Staff packet freshness evaluation
    - bounded editorial projection execution after explicit capability promotion
  does_not_own:
    - human review decisions
    - GitHub estate authority or repository health/readiness semantics
    - estate surface authority, lifecycle, promotion, or semantic ownership
    - accounting document intake
    - durable editorial constitution or Matias-authentic idea authority
    - upstream media, economic, or scientific source semantics
    - automatic acceptance of reentry proposals into Control Tower state

interfaces:
  consumes:
    - control:control-tower-v2@2 (read-only semantic control plane)
    - context:github-repositories@1 (advisory identity/estate context from projects)
    - registry:estate-surfaces@1 (advisory governance context from projects)
    - artifact:ops.capture-record@1
  produces:
    - artifact:ops.control-state-snapshot@2
    - artifact:ops.work-item-set@1
    - artifact:ops.staff-preparation-set@2
    - artifact:ops.staff-packet@2
    - artifact:ops.principal-brief@2
    - artifact:ops.execution-plan@2
    - artifact:ops.execution-packet@2
    - artifact:ops.execution-receipt@2
    - artifact:ops.closure-set@2
    - artifact:ops.reentry-proposal@2
    - artifact:ops.office-generation@2
    - artifact:ops.office-current-pointer@2
    - artifact:ops.office-run-record@1
    - artifact:ops.runtime-health-projection@2

upstream:
  - repo.projects
  - repo.capture-site
  - repo.media-monitor
  - repo.atlas-economico-ar

downstream:
  - repo.office-review
  - external:x

canonical_commands:
  - make smoke
  - make parent-audit
  - make office-v2-shadow
  - make office-v2-generate
  - make runtime-health-v2
  - make runtime-contracts

generated_paths:
  - artifacts/v2/
  - artifacts/evidence/
  - artifacts/estate-movement/
  - artifacts/logs/

invariants:
  - one Control Tower snapshot digest per coherent generation
  - front_id is canonical Office identity
  - local filesystem paths are resolved observations, never semantic identity
  - free-text needs is context, never machine routing syntax
  - Staff never rereads Control Tower during a generation
  - Principal consumes prepared Staff packets, not raw estate state
  - Principal decisions are never inferred as execution authorization
  - execution packets may originate only from ready pulls
  - execution never regains update_state or open_work_items powers
  - receipts must bind to the exact execution packet and snapshot generation
  - reentry produces reviewable proposals and performs no governance mutation
  - current points only to a fully successful coherent generation
  - every real generation attempt leaves a canonical run record
  - runtime health is derived by Run Record Owner rather than self-reported by producers
  - unknown freshness is never treated as fresh

verification:
  status: office-v2-core
  last_verified: '2026-09-15'
  command: make parent-audit
  notes:
    - historical Office v1, Staff-v1, Repo Health/GCP, and legacy prepared-block implementations were removed in M9; Git history is the archive
    - Capture, Evidence, Estate Movement, and Editorial remain explicit sidecars
    - scheduler cutover is a separate explicit installation action and merging source does not mutate installed user timers
    - Office Review is a downstream projection and will be upgraded to the v2 artifact contract separately

maintenance:
  cadence: quarterly
  next_review: '2026-12-01'
