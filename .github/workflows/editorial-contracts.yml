name: Editorial contracts

on:
  pull_request:
    paths:
      - "src/office_runtime/editorial/**"
      - "config/editorial/**"
      - "tests/test_editorial_contracts.py"
      - "docs/architecture/editorial-projection.md"
      - "SYSTEM.yaml"
      - "Makefile"
      - ".github/workflows/editorial-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile editorial package
        run: python -m compileall src/office_runtime/editorial
      - name: Run W0 contract acceptance
        run: make editorial-contracts
