name: Parent runtime CI

on:
  pull_request:
    paths:
      - "src/office_runtime/**"
      - "!src/office_runtime/editorial/**"
      - "requirements/**"
      - "requirements*.txt"
      - "systemd/**"
      - "tests/test_dependency_profiles.py"
      - "tests/test_systemd_install.py"
      - "tests/test_makefile_entrypoints.py"
      - "tests/test_control_snapshot_v2.py"
      - "tests/test_identity_resolution_v2.py"
      - "tests/test_work_item_compiler_v1.py"
      - "tests/test_staff_preparation_v2.py"
      - "tests/test_principal_compiler_v2.py"
      - "tests/test_execution_compiler_v2.py"
      - "tests/test_reentry_v2.py"
      - "tests/test_generation_v2.py"
      - "tests/test_generation_run_records.py"
      - "tests/test_generation_invariants.py"
      - "tests/test_run_record_health.py"
      - "tests/test_staff_packet_freshness.py"
      - "tests/test_capture_lifecycle.py"
      - "tests/test_capture_transcription.py"
      - "Makefile"
      - ".github/workflows/runtime-ci.yml"
      - "README.md"
      - "docs/**"
      - "SYSTEM.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  contracts:
    name: parent contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile parent runtime without Editorial
        run: python -m compileall -q -x '/editorial/' src/office_runtime
      - name: Validate dependency authority
        run: python src/office_runtime/scripts/install_profile.py --check
      - name: Validate dependency and scheduler contracts
        run: python -m unittest tests.test_dependency_profiles tests.test_systemd_install tests.test_makefile_entrypoints
      - name: Validate parent documentation scope
        run: make parent-docs-check

  profiles:
    name: ${{ matrix.profile }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: office
            python-version: "3.12"
          - profile: capture
            python-version: "3.12"
          - profile: full
            python-version: "3.11"
          - profile: full
            python-version: "3.12"
            test-tooling: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/constraints.txt
            requirements/profiles/${{ matrix.profile }}.txt
            requirements/test.txt
      - name: Install declared runtime profile
        run: python src/office_runtime/scripts/install_profile.py ${{ matrix.profile }}
      - name: Install constrained test tooling
        if: matrix.test-tooling == true
        run: python -m pip install -c requirements/constraints.txt -r requirements/test.txt
      - name: Check resolved environment
        run: python -m pip check
      - name: Import-smoke declared capability surface
        run: python src/office_runtime/scripts/profile_smoke.py ${{ matrix.profile }}
      - name: Office v2 semantic, generation, observability, and freshness tests
        if: matrix.profile == 'office'
        run: >-
          python -m unittest
          tests.test_control_snapshot_v2
          tests.test_identity_resolution_v2
          tests.test_work_item_compiler_v1
          tests.test_staff_preparation_v2
          tests.test_principal_compiler_v2
          tests.test_execution_compiler_v2
          tests.test_reentry_v2
          tests.test_generation_v2
          tests.test_generation_run_records
          tests.test_generation_invariants
          tests.test_run_record_health
          tests.test_staff_packet_freshness
      - name: Capture stable offline tests
        if: matrix.profile == 'capture'
        run: python -m unittest tests.test_capture_lifecycle tests.test_capture_transcription
      - name: Full supported-runtime acceptance
        if: matrix.profile == 'full' && matrix.python-version == '3.12'
        run: |
          make parent-audit
          python -m unittest \
            tests.test_dependency_profiles \
            tests.test_systemd_install \
            tests.test_makefile_entrypoints \
            tests.test_control_snapshot_v2 \
            tests.test_identity_resolution_v2 \
            tests.test_work_item_compiler_v1 \
            tests.test_staff_preparation_v2 \
            tests.test_principal_compiler_v2 \
            tests.test_execution_compiler_v2 \
            tests.test_reentry_v2 \
            tests.test_generation_v2 \
            tests.test_generation_run_records \
            tests.test_generation_invariants \
            tests.test_run_record_health \
            tests.test_staff_packet_freshness \
            tests.test_capture_lifecycle \
            tests.test_capture_transcription
