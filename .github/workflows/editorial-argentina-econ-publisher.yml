name: Editorial Argentina Econ — Sheet publisher

# Cloud-hosted executor only. No post is sent unless BOTH repository switches
# enable publishing and the runtime independently verifies every mutation gate.
on:
  schedule:
    # Deliberately off the top of the hour; GitHub schedule timing is best-effort.
    # 48 checks/day (versus 288/day for a five-minute cron).
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run reads/validates only; apply additionally requires BOTH production switches."
        required: true
        type: choice
        default: dry_run
        options: [dry_run, apply]

permissions:
  contents: read

concurrency:
  group: editorial-argentina-econ-publisher
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publisher:
    # Default false. Disabled schedules allocate no runner minutes.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.EDITORIAL_ECON_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      EDITORIAL_RUNTIME_PROFILE: editorial
      EDITORIAL_ARGENTINA_ECON_SHEET_ID: ${{ vars.EDITORIAL_ARGENTINA_ECON_SHEET_ID }}
      EDITORIAL_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EDITORIAL_GOOGLE_CREDENTIALS_JSON }}
      EDITORIAL_ECON_PUBLISH_ENABLED: ${{ vars.EDITORIAL_ECON_PUBLISH_ENABLED || 'false' }}
      EDITORIAL_ECON_RUNTIME_PROMOTED: ${{ vars.EDITORIAL_ECON_RUNTIME_PROMOTED || 'false' }}
      EDITORIAL_ARGENTINA_ECON_PUBLISHER_DISABLED: ${{ vars.EDITORIAL_ARGENTINA_ECON_PUBLISHER_DISABLED || '1' }}
      REQUESTED_MODE: ${{ inputs.mode || 'dry_run' }}
      HOME: ${{ runner.temp }}/editorial-argentina-econ-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve publishing authority
        id: authority
        run: |
          set -euo pipefail
          mode=dry-run
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_MODE}" == "apply" ]]; then
            mode=apply
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${EDITORIAL_ECON_PUBLISH_ENABLED}" == "true" ]]; then
            mode=apply
          fi
          if [[ "${mode}" == "apply" ]]; then
            if [[ "${EDITORIAL_ECON_RUNTIME_PROMOTED}" != "true" || "${EDITORIAL_ECON_PUBLISH_ENABLED}" != "true" || "${EDITORIAL_ARGENTINA_ECON_PUBLISHER_DISABLED}" != "0" ]]; then
              echo "::error::Apply requires runtime promotion, EDITORIAL_ECON_PUBLISH_ENABLED=true and EDITORIAL_ARGENTINA_ECON_PUBLISHER_DISABLED=0."
              exit 2
            fi
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Mode: ${mode}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preflight isolated economics resources
        run: |
          set -euo pipefail
          test "${EDITORIAL_ARGENTINA_ECON_SHEET_ID}" = "1LAVlYY3T7POA3IUydn3zy2MQBrxc-3c1w-iUq7oFtgo" || {
            echo "::error::Economics workbook mismatch; refusing developer or unknown workbook."
            exit 2
          }
          test -n "${EDITORIAL_GOOGLE_CREDENTIALS_JSON}" || {
            echo "::error::EDITORIAL_GOOGLE_CREDENTIALS_JSON secret is required."
            exit 2
          }
          python - <<'PY'
          import json
          import os
          credential = json.loads(os.environ['EDITORIAL_GOOGLE_CREDENTIALS_JSON'])
          if credential.get('type') != 'service_account':
              raise SystemExit('EDITORIAL_GOOGLE_CREDENTIALS_JSON must be a service account')
          PY
          mkdir -p "${HOME}/.xurl"
          chmod 700 "${HOME}" "${HOME}/.xurl"

      - name: Install pinned runtime and xurl
        run: |
          set -euo pipefail
          python src/office_runtime/scripts/install_profile.py editorial
          python -m pip install PyYAML==6.0.3
          npm install --global @xdevplatform/xurl@1.3.4
          command -v xurl
          xurl --version

      - name: Restore economics-only OAuth1 credentials from GitHub secret
        env:
          EDITORIAL_ECON_XURL_OAUTH1_YAML: ${{ secrets.EDITORIAL_ECON_XURL_OAUTH1_YAML }}
        run: |
          set -euo pipefail
          python src/office_runtime/scripts/editorial_econ_oauth1_secret.py

      - name: Execute bounded Sheet cycle
        id: cycle
        run: |
          set -euo pipefail
          test -f src/office_runtime/scripts/run_editorial_argentina_cycle.py || {
            echo "::error::Scheduler-neutral cycle not integrated: see docs/operations/editorial-argentina-econ-actions.md."
            exit 2
          }
          args=(--dry-run)
          if [[ "${{ steps.authority.outputs.mode }}" == "apply" ]]; then
            args=(--apply)
          fi
          python src/office_runtime/scripts/run_editorial_argentina_cycle.py "${args[@]}"

      - name: Safe operator summary
        if: always()
        run: |
          {
            echo "### Editorial Argentina Econ"
            echo "- Runner: GitHub Actions (laptop-independent)"
            echo "- Publish gate: two independent repository variables"
            echo "- Profile: argentina_econ"
            echo "- Expected X user ID: 57242581"
            echo "- Review this job's status; NEVER assume schedule ran on time."
          } >> "${GITHUB_STEP_SUMMARY}"
