name: X Observer — read-only qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run is the only mode until durable storage is promoted"
        required: true
        type: choice
        default: dry_run
        options: [dry_run]

permissions:
  contents: read

jobs:
  observer:
    if: ${{ vars.X_OBSERVER_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      X_OBSERVER_BEARER_TOKEN: ${{ secrets.X_OBSERVER_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline observer qualification
        run: |
          set -euo pipefail
          python -m unittest tests.test_x_observer_phase_a tests.test_x_observer_storage_projection
          python -m office_runtime.scripts.run_x_observer --dry-run
          echo "Observer scheduling remains closed until durable storage and O1 identity qualification are promoted."
